<!-- Change Password Container Component -->
<div class="settings-card" style="background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); max-width: 500px; margin-top: 20px;">
    <h3 style="color: var(--pinnacle-dark-text); margin-bottom: 5px; font-size: 1.2rem;">Change Account Password</h3>
    <p style="color: #6c757d; font-size: 0.85rem; margin-bottom: 20px;">Keep your authorization security keys current.</p>
    
    <div id="changeSuccess" style="display:none; padding:10px; background:#e6f4ea; color:#137333; font-size:0.85rem; border-radius:4px; margin-bottom:15px;"></div>

    <form id="changePasswordForm">
        <div style="margin-bottom: 15px;">
            <label style="display:block; font-size:0.85rem; font-weight:600; margin-bottom:5px;">Current Password</label>
            <input type="password" id="currentPass" class="auth-field" required style="width:100%; padding:10px; border:1px solid rgba(0,0,0,0.15); border-radius:4px;">
        </div>
        <div style="margin-bottom: 15px;">
            <label style="display:block; font-size:0.85rem; font-weight:600; margin-bottom:5px;">New Password</label>
            <input type="password" id="newPass" class="auth-field" required style="width:100%; padding:10px; border:1px solid rgba(0,0,0,0.15); border-radius:4px;">
        </div>
        <div style="margin-bottom: 20px;">
            <label style="display:block; font-size:0.85rem; font-weight:600; margin-bottom:5px;">Confirm New Password</label>
            <input type="password" id="confirmPass" class="auth-field" required style="width:100%; padding:10px; border:1px solid rgba(0,0,0,0.15); border-radius:4px;">
        </div>
        <button type="submit" style="background: var(--pinnacle-crimson); color:white; border:none; padding:12px 20px; border-radius:4px; font-weight:600; cursor:pointer;">Update Password</button>
    </form>
</div>

<script>
document.getElementById('changePasswordForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const currentPass = document.getElementById('currentPass').value;
    const newPass = document.getElementById('newPass').value;
    const confirmPass = document.getElementById('confirmPass').value;
    const alertBox = document.getElementById('changeSuccess');

    if (newPass !== confirmPass) {
        alertBox.textContent = "New passwords do not match.";
        alertBox.style.background = "#fce8e6";
        alertBox.style.color = "#c5221f";
        alertBox.style.display = "block";
        return;
    }

    // Process update validation state
    alertBox.textContent = "Account keys changed successfully!";
    alertBox.style.background = "#e6f4ea";
    alertBox.style.color = "#137333";
    alertBox.style.display = "block";
    this.reset();
});
</script>
