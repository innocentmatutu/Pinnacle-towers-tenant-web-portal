<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Financial Dashboard | Pinnacle Towers</title>
    <link rel="stylesheet" href="../css/variables.css">
</head>
<body>
    <div id="sidebar-container"></div>
    
    <main style="margin-left: var(--sidebar-width); padding: var(--spacing-md);">
        <h1>Financial Dashboard</h1>
        <p>Overview of total rent collection and building performance.</p>

        <section style="background: var(--pinnacle-card-white); padding: var(--spacing-md); border-radius: var(--radius-md); margin-top: 20px;">
            <h2>Search Tenant</h2>
            <input type="text" id="search-box" placeholder="Enter username..." onkeyup="searchTenant()" style="padding: 10px; width: 100%; max-width: 300px;">
            <div id="search-results" style="margin-top: 20px;"></div>
        </section>
    </main>

    <script src="../js/components.js"></script>
    <script>
        async function searchTenant() {
            const searchTerm = document.getElementById('search-box').value.toLowerCase();
            
            // Ensure path to JSON is correct
            const response = await fetch('../tenant/rent_data.json');
            const data = await response.json();
            
            const results = Object.keys(data).filter(username => username.toLowerCase().includes(searchTerm));
            const list = document.getElementById('search-results');
            
            // Render the results
            list.innerHTML = results.map(user => `
                <div style="padding: 10px; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; max-width: 400px;">
                    <span>${user}</span>
                    <button onclick="window.location.href='invoices.html?user=${user}'" style="padding: 5px 10px; cursor: pointer;">Generate Invoice</button>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
