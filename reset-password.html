<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinnacle Towers - Reset Password</title>
    <link rel="stylesheet" href="css/variables.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--pinnacle-bg-light); display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        .pinnacle-auth-card {
            background: var(--pinnacle-card-white);
            padding: 40px 30px; 
            border-radius: 12px; 
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
            border-top: 5px solid var(--pinnacle-crimson); 
            width: 100%;
            max-width: 420px;
        }
        .auth-header h1 { font-size: 1.75rem; margin-bottom: 6px; text-align: center; color: var(--pinnacle-dark-text); }
        .auth-header p { color: #6c757d; font-size: 0.95rem; margin-bottom: 35px; text-align: center; }
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 8px; }
        .auth-field { width: 100%; padding: 12px 15px; font-size: 0.95rem; border: 1px solid rgba(0, 0, 0, 0.12); border-radius: 6px; outline: none; }
        .auth-field:focus { border-color: #a8aeb4; }
        .action-btn { width: 100%; padding: 14px; background-color: var(--pinnacle-crimson); color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; }
        .success-message { display: none; background: #e6f4ea; color: #137333; padding: 15px; border-radius: 6px; font-size: 0.9rem; margin-bottom: 20px; text-align: center; }
    </style>
</head>
<body>

    <div class="pinnacle-auth-card">
        <header class="auth-header">
            <h1>Reset Password</h1>
            <p id="flow-desc">Enter your account email to receive a recovery token.</p>
        </header>

        <div id="successAlert" class="success-message"></div>

        <!-- Step A: Request Token Form -->
        <form id="requestTokenForm">
            <div class="input-group">
                <label for="email">Account Email</label>
                <input type="email" id="email" class="auth-field" required placeholder="name@example.com">
            </div>
            <button type="submit" class="action-btn">Send Recovery Token</button>
        </form>

        <!-- Step B: Set New Password Form (Hidden initially) -->
        <form id="setNewPasswordForm" style="display: none;">
            <div class="input-group">
                <label for="token">Recovery Token</label>
                <input type="text" id="token" class="auth-field" required placeholder="Enter token received">
            </div>
            <div class="input-group">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" class="auth-field" required placeholder="Minimum 6 characters">
            </div>
            <button type="submit" class="action-btn">Update Password</button>
        </form>

        <div style="text-align: center; margin-top: 20px;">
            <a href="index.html" style="color: #6c757d; font-size: 0.85rem; text-decoration: none;">← Back to Login</a>
        </div>
    </div>

    <script>
        const requestForm = document.getElementById('requestTokenForm');
        const setPasswordForm = document.getElementById('setNewPasswordForm');
        const successAlert = document.getElementById('successAlert');
        const flowDesc = document.getElementById('flow-desc');

        // Handle Request Token Submit
        requestForm.addEventListener('submit', (e) => {
            e.preventDefault();
            successAlert.textContent = "A recovery token has been simulated! Use token code: PINN77";
            successAlert.style.display = "block";
            requestForm.style.display = "none";
            setPasswordForm.style.display = "block";
            flowDesc.textContent = "Enter your recovery token to configure your credentials.";
        });

        // Handle Setting New Password
        setPasswordForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const token = document.getElementById('token').value.trim();
            
            if(token === 'PINN77') {
                successAlert.textContent = "Password updated successfully! Redirecting to portal authentication gateway...";
                successAlert.style.backgroundColor = "#e6f4ea";
                successAlert.style.color = "#137333";
                
                setTimeout(() => {
                    window.location.href = "index.html";
                }, 2500);
            } else {
                successAlert.textContent = "Invalid token security mismatch. Use PINN77 for simulation.";
                successAlert.style.backgroundColor = "#fce8e6";
                successAlert.style.color = "#c5221f";
            }
        });
    </script>
</body>
</html>
